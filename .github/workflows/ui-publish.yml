# 产物仓自己的发布 workflow：主仓 CI 把 manifest + tar.gz 推上来后，
# 由这里用**本仓自带的 GITHUB_TOKEN** 建 release —— 全程不需要任何跨仓令牌。
# --latest=true 保证客户端那句 releases/latest/download/... 永远指向最新发布。
name: publish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读 manifest
        id: m
        run: |
          set -euo pipefail
          if [ ! -f ui-manifest.json ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          V=$(jq -r .version ui-manifest.json)
          F=$(jq -r .file ui-manifest.json)
          N=$(jq -r '.notes // ("UI " + .version + " 构建于 " + .builtAt)' ui-manifest.json | tr '\n' ' ')
          { echo "skip=false"; echo "version=$V"; echo "file=$F"; echo "notes=$N"; } >> "$GITHUB_OUTPUT"

      - name: 建或更新 release
        if: steps.m.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 清单里的 notes 是人在 dispatch 时敲的自由文本：经 env 传给 shell，
          # 不嵌进 run 脚本体，免得一段引号就把脚本改了。
          VER: ${{ steps.m.outputs.version }}
          FILE: ${{ steps.m.outputs.file }}
          NOTES: ${{ steps.m.outputs.notes }}
        run: |
          set -euo pipefail
          test -f "$FILE" || { echo "!! manifest 指向的 $FILE 不在仓库里" >&2; exit 1; }
          if gh release view "v$VER" >/dev/null 2>&1; then
            # 同号重发（主仓勾 force 修坏包/坏清单）时，光覆盖资产不够，
            # 正文也得跟着新清单走，否则坏那次的说明会一直挂在 release 页上。
            gh release upload "v$VER" "$FILE" ui-manifest.json --clobber
            gh release edit "v$VER" --latest --notes "$NOTES"
          else
            gh release create "v$VER" "$FILE" ui-manifest.json --title "ui $VER" --latest=true --notes "$NOTES"
          fi
          echo "就绪: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/ui-manifest.json"
